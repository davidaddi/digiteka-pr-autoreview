name: review

on:
  issue_comment:
    types: [created]

concurrency:
  group: review-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: [self-hosted, hermes-review]
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      statuses: write

    steps:
      - name: Acknowledge the command
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes --silent

      - name: Read the command
        id: cmd
        run: |
          body=$(printf '%s' "${{ github.event.comment.body }}" | head -1)
          case "$body" in
            /review*) echo "action=review" >> "$GITHUB_OUTPUT" ;;
            /fix*)    echo "action=fix"    >> "$GITHUB_OUTPUT" ;;
            /revert*) echo "action=revert" >> "$GITHUB_OUTPUT" ;;
            *)        echo "action=none"   >> "$GITHUB_OUTPUT" ;;
          esac
          echo "target=$(printf '%s' "$body" | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Run it
        if: steps.cmd.outputs.action != 'none'
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HERMES_PROVIDER: ${{ vars.HERMES_PROVIDER }}
          HERMES_MODEL: ${{ vars.HERMES_MODEL }}
          HERMES_TIMEOUT: '3300'
        run: |
          cd "${REVIEWER_HOME:-$HOME/pr-review-sandbox}"
          [ -f "$HOME/pr-review-secrets/openrouter.env" ] && . "$HOME/pr-review-secrets/openrouter.env"
          export OPENROUTER_API_KEY
          printf 'REPO="%s"\nGITHUB_TOKEN="%s"\nGH_TOKEN="%s"\nPATH="%s"\n' \
            "$REPO" "$GITHUB_TOKEN" "$GITHUB_TOKEN" "$HOME/.local/bin:$PATH" > .runtime.env
          chmod 600 .runtime.env
          SANDBOX_ROOT="$PWD" node src/review/dispatch.mjs "${{ github.event.issue.number }}" \
            "${{ steps.cmd.outputs.action }}" "${{ steps.cmd.outputs.target }}"

      - name: Say it failed
        if: failure() && steps.cmd.outputs.action != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
            -f body="The ${{ steps.cmd.outputs.action }} did not finish. See the workflow run for why." --silent
